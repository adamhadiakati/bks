<script>
  (() => {
    const back4appAppId = window.__BACK4APP_APP_ID__;
    const back4appRestKey = window.__BACK4APP_REST_KEY__;
    const back4appClass = window.__BACK4APP_CLASS__ || "BookstoreData";
    const nativeGetItem = Storage.prototype.getItem;
    const nativeSetItem = Storage.prototype.setItem;
    const sessionKeys = new Set(["bk_admin", "bk_cust", "bk_customer"]);
    window.__bkDataConnectionRequired = true;
    window.__bkDataConnectionReady = false;
    const numericId = (value, fallback) => {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : fallback;
    };
    const normalizeDatabase = (value) => {
      if (!value || typeof value !== "object" || Array.isArray(value)) {
        return value;
      }

      const customers = Array.isArray(value.customers)
        ? value.customers.map((customer, index) => ({
            ...customer,
            id: numericId(customer?.id, index + 1),
          }))
        : [];
      const orders = Array.isArray(value.orders)
        ? value.orders.map((order, index) => {
            const buyer =
              order?.buyer && typeof order.buyer === "object"
                ? order.buyer
                : {};
            const items = Array.isArray(order?.items)
              ? order.items.map((item) => ({
                  ...item,
                  title: String(item?.title || "Book"),
                  qty: Math.max(1, numericId(item?.qty, 1)),
                  price: numericId(item?.price, 0),
                }))
              : [];
            const status = ["pending", "paid", "completed", "cancelled"].includes(
              order?.status,
            )
              ? order.status
              : "paid";
            return {
              ...order,
              id: numericId(order?.id, index + 1),
              orderNo: String(order?.orderNo || `ORD-${index + 1}`),
              date:
                typeof order?.date === "string" && order.date
                  ? order.date
                  : typeof order?.createdAt === "string" && order.createdAt
                    ? order.createdAt
                    : new Date().toISOString(),
              customerId:
                order?.customerId == null
                  ? null
                  : numericId(order.customerId, order.customerId),
              buyer: {
                name: String(buyer.name || "Unknown buyer"),
                email: String(buyer.email || ""),
                phone: String(buyer.phone || ""),
              },
              items,
              total: numericId(order?.total, 0),
              paymentMethod: String(order?.paymentMethod || "Paystack"),
              status,
            };
          })
        : [];

      return { ...value, customers, orders };
    };
    const normalizeSavedData = (value) => {
      if (!value || typeof value !== "object" || Array.isArray(value)) {
        return value;
      }
      const normalized = { ...value };
      const legacyDatabaseKeys = [
        "store",
        "users",
        "customers",
        "books",
        "orders",
        "nextBid",
        "nextOid",
        "nextCid",
        "nextUid",
      ];
      const database =
        normalized.bk_cache &&
        typeof normalized.bk_cache === "object" &&
        !Array.isArray(normalized.bk_cache)
          ? { ...normalized.bk_cache }
          : {};
      legacyDatabaseKeys.forEach((key) => {
        const nestedValue = database[key];
        const legacyValue = normalized[key];
        const nestedIsEmptyArray =
          Array.isArray(nestedValue) &&
          nestedValue.length === 0 &&
          Array.isArray(legacyValue) &&
          legacyValue.length > 0;
        if (nestedValue === undefined || nestedIsEmptyArray) {
          if (legacyValue !== undefined) database[key] = legacyValue;
        }
      });
      normalized.bk_cache = normalizeDatabase(database);
      return normalized;
    };
    window.__bkNormalizeDatabase = normalizeDatabase;
    window.__bkNormalizeSavedData = normalizeSavedData;
    try {
      const localCache = nativeGetItem.call(localStorage, "bk_cache");
      if (localCache) {
        const parsedCache = JSON.parse(localCache);
        const normalizedCache = normalizeDatabase(parsedCache);
        nativeSetItem.call(
          localStorage,
          "bk_cache",
          JSON.stringify(normalizedCache),
        );
      }
    } catch {
      // The app will fall back to its default catalogue if local data is invalid.
    }

    try {
      const request = new XMLHttpRequest();
      request.open(
        "GET",
        `https://parseapi.back4app.com/classes/${back4appClass}?limit=1&order=-updatedAt`,
        false,
      );
      request.setRequestHeader("X-Parse-Application-Id", back4appAppId);
      request.setRequestHeader("X-Parse-REST-API-Key", back4appRestKey);
      request.send();
      if (request.status < 200 || request.status >= 300) {
        console.error(
          "[back4app] load failed:",
          request.status,
          request.responseText,
        );
      }
      if (request.status >= 200 && request.status < 300) {
        const response = JSON.parse(request.responseText);
        const record = response?.results?.[0];
        const savedData = normalizeSavedData(record?.state);
        if (record?.objectId) {
          nativeSetItem.call(localStorage, "bk_back4app_oid", record.objectId);
        }
        if (record?.updatedAt) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_updated_at",
            record.updatedAt,
          );
        }
        if (savedData && typeof savedData === "object" && !Array.isArray(savedData)) {
          window.__bkDataConnectionReady = true;
          Object.entries(savedData).forEach(([key, value]) => {
            if (sessionKeys.has(key)) return;
            nativeSetItem.call(
              localStorage,
              key,
              typeof value === "string" ? value : JSON.stringify(value),
            );
          });
        }
      }
    } catch {
      // Continue with the browser's locally saved data.
    }

    sessionKeys.forEach((key) => {
      const localValue = nativeGetItem.call(localStorage, key);
      const sessionValue = nativeGetItem.call(sessionStorage, key);
      if (localValue !== null && sessionValue === null) {
        nativeSetItem.call(sessionStorage, key, localValue);
      } else if (localValue === null && sessionValue !== null) {
        nativeSetItem.call(localStorage, key, sessionValue);
      }
    });

    // Remove legacy JSONBin access keys after switching the store backend.
    localStorage.removeItem("bk_bin");
    localStorage.removeItem("bk_key");

<script>
  (() => {
    // Keep the bundled catalogue code compatible while routing its old
    // JSONBin calls to the Back4App record loaded above.
    const back4appAppId = window.__BACK4APP_APP_ID__;
    const back4appRestKey = window.__BACK4APP_REST_KEY__;
    const back4appClass = window.__BACK4APP_CLASS__ || "BookstoreData";
    const nativeFetch = window.fetch.bind(window);
    const nativeSetItem = Storage.prototype.setItem;
    const back4appUrl = (objectId = "") =>
      `https://parseapi.back4app.com/classes/${back4appClass}${objectId ? `/${encodeURIComponent(objectId)}` : ""}`;
    const back4appHeaders = {
      "Content-Type": "application/json",
      "X-Parse-Application-Id": back4appAppId,
      "X-Parse-REST-API-Key": back4appRestKey,
    };
    const jsonResponse = (body, status = 200) =>
      new Response(JSON.stringify(body), {
        status,
        headers: { "Content-Type": "application/json" },
      });

    // The original app uses these two values only as a "configured" flag and
    // to build JSONBin URLs. The fetch adapter below handles those URLs.
    nativeSetItem.call(localStorage, "bk_bin", "back4app");
    nativeSetItem.call(localStorage, "bk_key", "back4app");

    window.fetch = async (input, init = {}) => {
      const url = typeof input === "string" ? input : input?.url || "";
      if (
        !url.includes("api.jsonbin.io") ||
        !back4appAppId ||
        !back4appRestKey
      ) {
        return nativeFetch(input, init);
      }

      const method = String(init.method || "GET").toUpperCase();
      const objectId = localStorage.getItem("bk_back4app_oid") || "";

      if (method === "GET" && url.includes("/latest")) {
        const response = await nativeFetch(
          `${back4appUrl()}?limit=1&order=-updatedAt`,
          { headers: back4appHeaders },
        );
        if (!response.ok) {
          window.__bkDataConnectionReady = false;
          return response;
        }
        const payload = await response.json();
        const record = payload?.results?.[0];
        if (!record) {
          window.__bkDataConnectionReady = false;
          return jsonResponse({ message: "Store is empty" }, 404);
        }
        window.__bkDataConnectionReady = true;
        if (record.objectId) {
          nativeSetItem.call(localStorage, "bk_back4app_oid", record.objectId);
        }
        if (record.updatedAt) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_updated_at",
            record.updatedAt,
          );
        }
        const savedData = window.__bkNormalizeSavedData
          ? window.__bkNormalizeSavedData(record.state || {})
          : record.state || {};
        return jsonResponse({ record: savedData });
      }

      if (method === "PUT") {
        let state;
        try {
          state = JSON.parse(String(init.body || "{}"));
        } catch {
          return jsonResponse({ message: "Invalid catalogue data" }, 400);
        }
        if (window.__bkNormalizeDatabase) {
          state = window.__bkNormalizeDatabase(state);
        }

        const response = await nativeFetch(back4appUrl(objectId), {
          method: objectId ? "PUT" : "POST",
          headers: back4appHeaders,
          body: JSON.stringify({ state }),
        });
        if (!response.ok) {
          window.__bkDataConnectionReady = false;
          return response;
        }

        const result = await response.json().catch(() => ({}));
        if (!objectId && result.objectId) {
          nativeSetItem.call(localStorage, "bk_back4app_oid", result.objectId);
        }
        if (result.updatedAt) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_updated_at",
            result.updatedAt,
          );
        }
        return jsonResponse({ record: state, ...result });
      }

      return nativeFetch(input, init);
    };
  })();
</script>

<script>
  (() => {
    const selector = '[data-testid="button-save-settings"]';
    const nativeFetch = window.fetch.bind(window);

    window.fetch = (input, init = {}) => {
      const url = typeof input === "string" ? input : input?.url || "";
      const method = String(init.method || "GET").toUpperCase();
      if (!url.includes("api.jsonbin.io")) {
        return nativeFetch(input, init);
      }

      if (method === "GET" && url.includes("/latest")) {
        return nativeFetch(input, init);
      }

      if (method === "PUT" && typeof init.body === "string") {
        let data = {};
        try {
          data = JSON.parse(init.body);
        } catch {
          return Promise.reject(new Error("Invalid saved store data"));
        }
        return nativeFetch(input, { ...init, body: JSON.stringify(data) });
      }

      return Promise.reject(
        new Error("The legacy JSONBin connection flow is no longer available."),
      );
    };

    const attachSaveFeedback = () => {
      const button = document.querySelector(selector);
      if (!button || button.dataset.saveFeedbackAttached === "true") return;

      button.type = "button";
      button.dataset.saveFeedbackAttached = "true";

      button.addEventListener(
        "click",
        () => {
          const card = button.closest(".admin-card");
          if (!card) return;

          let status = card.querySelector("[data-settings-save-status]");
          if (!status) {
            status = document.createElement("div");
            status.dataset.settingsSaveStatus = "true";
            status.setAttribute("role", "status");
            status.style.cssText =
              "margin-top:10px;color:var(--muted-copy);font-size:11px;";
            button.parentElement?.appendChild(status);
          }

          status.textContent = "Saving settings…";
          button.setAttribute("aria-busy", "true");

          window.setTimeout(() => {
            if (!document.contains(button) || !document.contains(status)) return;
            status.textContent = "Settings saved locally. Live sync will continue in the background.";
            button.removeAttribute("aria-busy");
            window.setTimeout(() => {
              if (document.contains(status)) status.textContent = "";
            }, 3500);
          }, 250);
        },
        true,
      );
    };

    const removeLegacyConnectionCard = () => {
      [...document.querySelectorAll(".admin-card")].forEach((card) => {
        const text = card.textContent || "";
        if (
          text.includes("Share store access") ||
          text.includes("JSONBin") ||
          text.includes("JSONBin.io")
        ) {
          card.remove();
        }
      });

      [...document.querySelectorAll(".alert, .notice")].forEach((alert) => {
        if (
          (alert.textContent || "").includes("Local mode is active") ||
          (alert.textContent || "").includes("JSONBin") ||
          (alert.textContent || "").includes("not been connected")
        ) {
          alert.remove();
        }
      });

      [...document.querySelectorAll(".admin-nav-button")].forEach((button) => {
        if (
          (button.textContent || "").trim() === "Access code" ||
          button.getAttribute("data-testid") === "button-admin-access"
        ) {
          button.remove();
        }
      });

      [...document.querySelectorAll(".text-link")].forEach((link) => {
        if ((link.textContent || "").trim() === "Connect or set up live database") {
          link.remove();
        }
      });
    };

    const updateAdminUi = () => {
      attachSaveFeedback();
      removeLegacyConnectionCard();
    };

    new MutationObserver(updateAdminUi).observe(document.documentElement, {
      childList: true,
      subtree: true,
    });
    updateAdminUi();
  })();
</script>
<script>
  (() => {
    const appFetch = window.fetch.bind(window);
    const readJson = (key) => {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : null;
      } catch {
        return null;
      }
    };
    const normalizePaymentSlug = (value) => {
      let slug = String(value || "").trim();
      if (!slug) return "";
      try {
        const parsed = new URL(slug);
        slug = parsed.pathname;
      } catch {
        // The admin may enter the slug without a protocol or hostname.
      }
      slug = slug.replace(/^.*\/pay\//i, "");
      try {
        slug = decodeURIComponent(slug);
      } catch {
        // Keep the original value if it contains malformed escape sequences.
      }
      return slug.split(/[/?#]/)[0].trim();
    };
    const paymentSlugKey = (book) =>
      `${String(book?.title || "").trim()}::${String(book?.author || "").trim()}`;
    const setPaymentSlugOverride = (key, slug) => {
      if (!key) return;
      const overrides = readJson("bk_payment_slugs") || {};
      overrides[key] = normalizePaymentSlug(slug);
      localStorage.setItem("bk_payment_slugs", JSON.stringify(overrides));
    };
    const rememberPaymentSlug = (book, slug) => {
      if (!book) return;
      setPaymentSlugOverride(String(book.id || ""), slug);
      setPaymentSlugOverride(paymentSlugKey(book), slug);
    };
    const getPaymentSlug = (book) => {
      if (!book) return "";
      const overrides = readJson("bk_payment_slugs") || {};
      return (
        normalizePaymentSlug(book.paystackSlug) ||
        normalizePaymentSlug(overrides[String(book.id || "")]) ||
        normalizePaymentSlug(overrides[paymentSlugKey(book)])
      );
    };
    window.__bkGetPaymentSlug = getPaymentSlug;

    const findField = (container, labelText) =>
      [...container.querySelectorAll(".field")].find(
        (field) =>
          field.querySelector("label")?.textContent?.trim() === labelText,
      );

    const getBookModal = () =>
      [...document.querySelectorAll(".modal")].find((modal) =>
        [...modal.querySelectorAll("button")].some(
          (button) => button.textContent?.trim() === "Save book",
        ),
      );

    window.__pendingBookPayment = null;

    window.fetch = (input, init = {}) => {
      const url = typeof input === "string" ? input : input?.url || "";
      const method = String(init.method || "GET").toUpperCase();
      const pending = window.__pendingBookPayment;

      if (
        method === "PUT" &&
        url.includes("api.jsonbin.io") &&
        pending &&
        typeof init.body === "string"
      ) {
        try {
          const body = JSON.parse(init.body);
          const book =
            body.books?.find(
              (item) =>
                item.title === pending.title &&
                (!pending.author || item.author === pending.author),
            ) || body.books?.find((item) => item.title === pending.title);
          if (book) {
            const slug = normalizePaymentSlug(pending.slug);
            book.paystackSlug = slug;
            rememberPaymentSlug(book, slug);
            localStorage.setItem("bk_cache", JSON.stringify(body));
            init = { ...init, body: JSON.stringify(body) };
          }
        } catch {
          // Leave non-JSON requests unchanged.
        }
      }

      return appFetch(input, init);
    };

    const saveBookPaymentSlug = () => {
      const modal = getBookModal();
      if (!modal) return;

      const titleInput = findField(modal, "Title")?.querySelector("input");
      const authorInput = findField(modal, "Author")?.querySelector("input");
      const slugInput = modal.querySelector("[data-book-paystack-slug]");
      if (!titleInput || !slugInput) return;

      window.__pendingBookPayment = {
        title: titleInput.value.trim(),
        author: authorInput?.value.trim() || "",
        slug: normalizePaymentSlug(slugInput.value),
      };
      slugInput.value = window.__pendingBookPayment.slug;
      setPaymentSlugOverride(
        `${window.__pendingBookPayment.title}::${window.__pendingBookPayment.author}`,
        window.__pendingBookPayment.slug,
      );

      window.setTimeout(() => {
        const data = readJson("bk_cache");
        const pending = window.__pendingBookPayment;
        if (!data?.books || !pending?.title) return;

        const book =
          data.books.find(
            (item) =>
              item.title === pending.title &&
              (!pending.author || item.author === pending.author),
          ) || data.books.find((item) => item.title === pending.title);
        if (!book) return;

        book.paystackSlug = normalizePaymentSlug(pending.slug);
        rememberPaymentSlug(book, book.paystackSlug);
        localStorage.setItem("bk_cache", JSON.stringify(data));
      }, 0);
    };

    const attachBookPaymentField = () => {
      const modal = getBookModal();
      if (!modal) return;

      const saveButton = [...modal.querySelectorAll("button")].find(
        (button) => button.textContent?.trim() === "Save book",
      );
      if (!saveButton) return;

      let slugInput = modal.querySelector("[data-book-paystack-slug]");
      if (!slugInput) {
        const deliveryField = findField(modal, "eBook delivery link");
        const field = document.createElement("div");
        field.className = "field";
        field.innerHTML =
          '<label>Payment page slug</label><input type="text" placeholder="book-payment-page-slug" data-book-paystack-slug><div class="admin-card-sub">Optional. Leave blank to use the store-wide payment page.</div>';
        if (deliveryField?.parentElement) {
          deliveryField.parentElement.insertBefore(field, deliveryField.nextSibling);
        } else {
          saveButton.parentElement?.insertBefore(field, saveButton);
        }
        slugInput = field.querySelector("[data-book-paystack-slug]");

        const data = readJson("bk_cache");
        const title = findField(modal, "Title")?.querySelector("input")?.value;
        const author = findField(modal, "Author")?.querySelector("input")?.value;
        const existing =
          data?.books?.find(
            (item) =>
              item.title === title &&
              (!author || item.author === author),
          ) || data?.books?.find((item) => item.title === title);
        if (slugInput && existing) {
          slugInput.value = getPaymentSlug(existing);
        }
      }

      if (saveButton.dataset.paymentSlugBound !== "true") {
        saveButton.dataset.paymentSlugBound = "true";
        saveButton.addEventListener("click", saveBookPaymentSlug, true);
      }
    };

    const removeStoreSettingsPaymentSection = () => {
      const heading = [...document.querySelectorAll(".eyebrow")].find(
        (item) => item.textContent?.trim() === "Paystack checkout",
      );
      const section = heading?.parentElement;
      if (
        section &&
        section.textContent?.includes("Payment page slug") &&
        section.textContent?.includes("Verify server URL")
      ) {
        section.remove();
      }
    };

    const nativeOpen = window.open.bind(window);
    window.open = (url, target, features, replace) => {
      let nextUrl = url;
      if (typeof url === "string" && url.includes("paystack.shop/pay/")) {
        const data = readJson("bk_cache");
        const cart = readJson("bk_cart") || [];
        const slug = cart
          .map((line) => data?.books?.find((book) => book.id === line.bookId))
          .map((book) => getPaymentSlug(book))
          .find(Boolean);
        if (slug) {
          const parsed = new URL(url, window.location.href);
          parsed.pathname = `/pay/${encodeURIComponent(slug)}`;
          nextUrl = parsed.toString();
        }
      }
      return nativeOpen(nextUrl, target, features, replace);
    };

    const observer = new MutationObserver(() => {
      attachBookPaymentField();
      removeStoreSettingsPaymentSection();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    attachBookPaymentField();
    removeStoreSettingsPaymentSection();
  })();
</script>

  (() => {
    const removeInjectedReplitPill = () => {
      document
        .querySelectorAll(

        )
        .forEach((node) => node.remove());

<script>
  (() => {
    const readJson = (key) => {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : null;
      } catch {
        return null;
      }
    };

    const getCatalog = () => readJson("bk_cache") || {};
    const getCartLines = () => {
      const catalog = getCatalog();
      const books = Array.isArray(catalog.books) ? catalog.books : [];
      const cart = Array.isArray(readJson("bk_cart")) ? readJson("bk_cart") : [];
      return cart
        .map((line) => ({
          line,
          book: books.find((book) => String(book.id) === String(line.bookId)),
        }))
        .filter(({ line, book }) => book && Number(line.qty) > 0);
    };
    const getPaymentSlug = (book) => {
      if (typeof window.__bkGetPaymentSlug === "function") {
        return window.__bkGetPaymentSlug(book);
      }
      return String(book?.paystackSlug || "").trim();
    };

    // The original cart keeps quantity 1 when the minus button is clicked.
    // Let its existing remove handler handle the last-item case instead.
    document.addEventListener(
      "click",
      (event) => {
        const target = event.target;
        const minusButton =
          target instanceof Element
            ? target.closest(".cart-line .quantity button:first-child")
            : null;
        if (!minusButton) return;

        const quantity = minusButton.parentElement?.querySelector("span")?.textContent?.trim();
        if (quantity !== "1") return;

        const cartLine = minusButton.closest(".cart-line");
        const removeButton = cartLine?.querySelector(".danger-action");
        if (!removeButton) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        window.setTimeout(() => removeButton.click(), 0);
      },
      true,
    );

    const handleCheckoutSubmit = (event) => {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      if (!form.querySelector('[data-testid="button-paystack"]')) return;

      const catalog = getCatalog();
      const lines = getCartLines().map(({ line, book }) => ({
        book,
        qty: Math.max(1, Number(line.qty) || 1),
      }));
      const bookSlugs = [
        ...new Set(lines.map(({ book }) => getPaymentSlug(book)).filter(Boolean)),
      ];
      if (bookSlugs.length > 1) {
        window.alert(
          "These books use different payment pages. Please check out one book at a time.",
        );
        return;
      }
      const slug = bookSlugs[0] || getPaymentSlug(catalog.store);

      // Preserve the app's own validation if there is no configured page at all.
      if (!slug) return;

      const formData = new FormData(form);
      const buyer = {
        name: String(formData.get("name") || "").trim(),
        email: String(formData.get("email") || "").trim(),
        phone: String(formData.get("phone") || "").trim(),
      };
      if (!buyer.name || !buyer.email || !lines.length) return;

      event.preventDefault();
      event.stopImmediatePropagation();

      const total = lines.reduce((sum, { book, qty }) => sum + Number(book.price || 0) * qty, 0);
      const reference = `BOOK${Date.now()}`;
      const customer = (() => {
        try {
          return JSON.parse(sessionStorage.getItem("bk_customer") || "null");
        } catch {
          return null;
        }
      })();
      const pendingOrder = {
        ref: reference,
        buyer,
        items: lines.map(({ book, qty }) => ({
          bookId: book.id,
          title: book.title,
          price: book.price,
          qty,
        })),
        total,
        customerId: customer?.id || null,
      };
      localStorage.setItem("bk_pending_order", JSON.stringify(pendingOrder));

      const callbackUrl =
        `${window.location.origin}${window.location.pathname}` +
        `?order_callback=1&ref=${encodeURIComponent(reference)}`;
      const paymentUrl =
        `https://paystack.shop/pay/${encodeURIComponent(slug)}` +
        `?email=${encodeURIComponent(buyer.email)}` +
        `&name=${encodeURIComponent(buyer.name)}` +
        `&amount=${Math.round(total * 100)}` +
        `&callback_url=${encodeURIComponent(callbackUrl)}`;
      const popup = window.open(
        paymentUrl,
        "PaystackBookPayment",
        "width=600,height=700,scrollbars=yes,resizable=yes",
      );

      if (!popup) {
        window.location.href = paymentUrl;
        return;
      }

      const timer = window.setInterval(() => {
        if (!popup.closed) return;
        window.clearInterval(timer);
        const verified = readJson(`bk_order_verified_${reference}`);
        localStorage.removeItem(`bk_order_verified_${reference}`);
        if (!verified) return;
        window.location.reload();
      }, 600);
    };

    document.addEventListener("submit", handleCheckoutSubmit, true);
  })();
</script>
<script>
  (() => {
    const root = document.getElementById("root");
    const gateId = "bk-data-connection-gate";
    const renderGate = () => {
      if (!root || !window.__bkDataConnectionRequired) return;
      const connected = window.__bkDataConnectionReady === true;
      let gate = document.getElementById(gateId);

      if (connected) {
        root.style.removeProperty("visibility");
        gate?.remove();
        return;
      }

      root.style.visibility = "hidden";
      if (gate) return;

      gate = document.createElement("main");
      gate.id = gateId;
      gate.setAttribute("role", "alert");
      gate.style.cssText =
        "position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#f6f0e7;color:#24211e;font-family:Inter,system-ui,sans-serif;text-align:center;";
      gate.innerHTML =
        '<div style="max-width:420px"><div style="font-size:42px;margin-bottom:16px">AA</div><h1 style="margin:0 0 10px;font:600 25px/1.2 Georgia,serif">Live data connection required</h1><p style="margin:0 0 22px;color:#6f665c;line-height:1.6">Connect to the shared Back4App store to open the bookstore. Local or stale data will not be used.</p><button type="button" style="border:0;border-radius:6px;padding:12px 18px;background:#24211e;color:#fff;font:600 14px system-ui;cursor:pointer">Retry connection</button></div>';
      gate.querySelector("button")?.addEventListener("click", () => {
        window.location.reload();
      });
      document.body.appendChild(gate);
    };

    renderGate();
    new MutationObserver(renderGate).observe(root, {
      childList: true,
      subtree: true,
    });
    window.setInterval(renderGate, 500);
  })();
</script>
<script>
  (() => {
    const back4appAppId = window.__BACK4APP_APP_ID__;
    const back4appRestKey = window.__BACK4APP_REST_KEY__;
    const back4appClass = window.__BACK4APP_CLASS__ || "BookstoreData";
    const excludedKeys = new Set([
      "bk_bin",
      "bk_key",
      "bk_admin",
      "bk_cust",
      "bk_customer",
      "bk_back4app_oid",
      "bk_back4app_updated_at",
    ]);
    const sessionKeys = new Set(["bk_admin", "bk_cust", "bk_customer"]);
    const nativeSetItem = Storage.prototype.setItem;
    const nativeRemoveItem = Storage.prototype.removeItem;
    let syncTimer = 0;
    let syncing = false;
    let syncQueued = false;

    const readSavedData = () => {
      const data = {};
      for (let index = 0; index < localStorage.length; index += 1) {
        const key = localStorage.key(index);
        if (!key || excludedKeys.has(key)) continue;
        const value = localStorage.getItem(key);
        try {
          const parsed = value === null ? null : JSON.parse(value);
          data[key] =
            key === "bk_cache" && window.__bkNormalizeDatabase
              ? window.__bkNormalizeDatabase(parsed)
              : parsed;
        } catch {
          data[key] = value;
        }
      }
      return data;
    };

    const syncSavedData = async (keepalive = false) => {
      if (syncing) {
        syncQueued = true;
        return;
      }

      syncing = true;
      try {
        const objectId = localStorage.getItem("bk_back4app_oid");
        const url = objectId
          ? `https://parseapi.back4app.com/classes/${back4appClass}/${objectId}`
          : `https://parseapi.back4app.com/classes/${back4appClass}`;
        const response = await fetch(url, {
          method: objectId ? "PUT" : "POST",
          keepalive,
          headers: {
            "Content-Type": "application/json",
            "X-Parse-Application-Id": back4appAppId,
            "X-Parse-REST-API-Key": back4appRestKey,
          },
          body: JSON.stringify({ state: readSavedData() }),
        });
        if (!response.ok) {
          window.__bkDataConnectionReady = false;
          console.error(
            "[back4app] sync failed:",
            response.status,
            await response.text().catch(() => ""),
          );
          throw new Error("Saved data sync failed");
        }
        window.__bkDataConnectionReady = true;
        if (!objectId) {
          const created = await response.json();
          if (created?.objectId) {
            nativeSetItem.call(localStorage, "bk_back4app_oid", created.objectId);
          }
        }
      } catch {
        // Keep local saves working when the sync server is unavailable.
      } finally {
        syncing = false;
        if (syncQueued) {
          syncQueued = false;
          scheduleSync();
        }
      }
    };

    const scheduleSync = () => {
      window.clearTimeout(syncTimer);
      syncTimer = window.setTimeout(syncSavedData, 400);
    };

    Storage.prototype.setItem = function (key, value) {
      nativeSetItem.call(this, key, value);
      if (this === sessionStorage && sessionKeys.has(key)) {
        nativeSetItem.call(localStorage, key, value);
      }
      if (this === localStorage && !excludedKeys.has(key)) scheduleSync();
    };

    Storage.prototype.removeItem = function (key) {
      nativeRemoveItem.call(this, key);
      if (this === sessionStorage && sessionKeys.has(key)) {
        nativeRemoveItem.call(localStorage, key);
      }
      if (this === localStorage && !excludedKeys.has(key)) scheduleSync();
    };

    window.addEventListener("pagehide", () => {
      // sendBeacon can't carry the custom Back4App auth headers, so use a
      // keepalive fetch instead (supported by all current browsers on unload).
      void syncSavedData(true);
    });

    scheduleSync();
  })();
</script>
<script>
  (() => {
    // Final network guard: the bundled legacy UI may still construct a
    // JSONBin URL, but no JSONBin request is allowed to leave this page.
    const previousFetch = window.fetch.bind(window);
    const back4appAppId = window.__BACK4APP_APP_ID__;
    const back4appRestKey = window.__BACK4APP_REST_KEY__;
    const back4appClass = window.__BACK4APP_CLASS__ || "BookstoreData";
    const nativeSetItem = Storage.prototype.setItem;
    const jsonResponse = (body, status = 200) =>
      new Response(JSON.stringify(body), {
        status,
        headers: { "Content-Type": "application/json" },
      });
    const back4appUrl = (objectId = "") =>
      `https://parseapi.back4app.com/classes/${back4appClass}${objectId ? `/${encodeURIComponent(objectId)}` : ""}`;
    const back4appHeaders = {
      "Content-Type": "application/json",
      "X-Parse-Application-Id": back4appAppId,
      "X-Parse-REST-API-Key": back4appRestKey,
    };

    window.fetch = async (input, init = {}) => {
      const url = typeof input === "string" ? input : input?.url || "";
      if (
        !url.includes("api.jsonbin.io") ||
        !back4appAppId ||
        !back4appRestKey
      ) {
        return previousFetch(input, init);
      }

      const method = String(init.method || "GET").toUpperCase();
      const objectId = localStorage.getItem("bk_back4app_oid") || "";

      if (method === "GET" && url.includes("/latest")) {
        const response = await previousFetch(
          `${back4appUrl()}?limit=1&order=-updatedAt`,
          { headers: back4appHeaders },
        );
        if (!response.ok) {
          window.__bkDataConnectionReady = false;
          return response;
        }
        const payload = await response.json();
        const record = payload?.results?.[0];
        if (!record) {
          window.__bkDataConnectionReady = false;
          return jsonResponse({ message: "Store is empty" }, 404);
        }
        window.__bkDataConnectionReady = true;
        if (record.objectId) {
          nativeSetItem.call(localStorage, "bk_back4app_oid", record.objectId);
        }
        if (record.updatedAt) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_updated_at",
            record.updatedAt,
          );
        }
        const savedData = window.__bkNormalizeSavedData
          ? window.__bkNormalizeSavedData(record.state || {})
          : record.state || {};
        return jsonResponse({ record: savedData });
      }

      if (method === "PUT") {
        let state;
        try {
          state = JSON.parse(String(init.body || "{}"));
        } catch {
          return jsonResponse({ message: "Invalid catalogue data" }, 400);
        }
        if (window.__bkNormalizeDatabase) {
          state = window.__bkNormalizeDatabase(state);
        }

        const response = await previousFetch(back4appUrl(objectId), {
          method: objectId ? "PUT" : "POST",
          headers: back4appHeaders,
          body: JSON.stringify({ state }),
        });
        if (!response.ok) {
          window.__bkDataConnectionReady = false;
          return response;
        }
        const result = await response.json().catch(() => ({}));
        if (!objectId && result.objectId) {
          nativeSetItem.call(localStorage, "bk_back4app_oid", result.objectId);
        }
        if (result.updatedAt) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_updated_at",
            result.updatedAt,
          );
        }
        return jsonResponse({ record: state, ...result });
      }

      return jsonResponse(
        { message: "The legacy JSONBin database is disabled." },
        410,
      );
    };
  })();
</script>
<script>
  (() => {
    const back4appAppId = window.__BACK4APP_APP_ID__;
    const back4appRestKey = window.__BACK4APP_REST_KEY__;
    const back4appClass = window.__BACK4APP_CLASS__ || "BookstoreData";
    const nativeSetItem = Storage.prototype.setItem;
    const sessionKeys = new Set(["bk_admin", "bk_cust", "bk_customer"]);
    let refreshInFlight = false;

    const refreshAdminData = async () => {
      if (
        refreshInFlight ||
        !sessionStorage.getItem("bk_admin") ||
        document.hidden ||
        !back4appAppId ||
        !back4appRestKey
      ) {
        return;
      }

      refreshInFlight = true;
      try {
        const response = await window.fetch(
          `https://parseapi.back4app.com/classes/${back4appClass}?limit=1&order=-updatedAt`,
          {
            headers: {
              "X-Parse-Application-Id": back4appAppId,
              "X-Parse-REST-API-Key": back4appRestKey,
            },
          },
        );
        if (!response.ok) return;

        const record = (await response.json())?.results?.[0];
        if (!record?.state || typeof record.state !== "object") return;

        const remoteUpdatedAt = String(record.updatedAt || "");
        const localUpdatedAt =
          localStorage.getItem("bk_back4app_updated_at") || "";
        if (record.objectId) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_oid",
            record.objectId,
          );
        }
        if (remoteUpdatedAt && remoteUpdatedAt === localUpdatedAt) return;

        const savedData = window.__bkNormalizeSavedData
          ? window.__bkNormalizeSavedData(record.state)
          : record.state;
        Object.entries(savedData).forEach(([key, value]) => {
          if (sessionKeys.has(key)) return;
          nativeSetItem.call(
            localStorage,
            key,
            typeof value === "string" ? value : JSON.stringify(value),
          );
        });
        if (remoteUpdatedAt) {
          nativeSetItem.call(
            localStorage,
            "bk_back4app_updated_at",
            remoteUpdatedAt,
          );
        }
        window.location.reload();
      } catch {
        // Keep the current admin session usable if a refresh is unavailable.
      } finally {
        refreshInFlight = false;
      }
    };

    window.addEventListener("focus", refreshAdminData);
    window.setInterval(refreshAdminData, 30000);
  })();
</script>
